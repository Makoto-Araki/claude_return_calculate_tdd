[project]
name = "calculator-api"
version = "0.1.0"
description = "2個の正の整数パラメータに対して四則演算を行うシンプルなAPIサーバー"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[tool.pytest.ini_options]
pythonpath = ["."]
